# Makes the fixed build command `python -I -m simulator ...` work: `-I` drops the current directory from
# sys.path, so the package must be installed. From the repo root:  pip install -e ./simulator
# (No-install alternative: `python -I simulator --seed 42 --out data/live_sim.db` from the repo root.)
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nightlife-live-sim"
version = "1.0.0"
description = "live-sim: deterministic synthetic nightlife simulator (ALL OUTPUT SYNTHETIC)"
requires-python = ">=3.11"
dependencies = ["pandas>=3.0", "numpy>=2.0"]

[tool.setuptools]
package-dir = {"simulator" = "."}
packages = ["simulator"]

[tool.setuptools.package-data]
simulator = ["config/*.json", "data/*.csv"]
