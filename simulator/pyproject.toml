# Optional. The build command is `python -m simulator --seed 42 --out data/live_sim.db` from the repo root
# (CONTRACTS f5c95d2). Install (`pip install -e ./simulator`) only to use `python -I -m simulator` from anywhere.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nightlife-live-sim"
version = "1.0.0"
description = "live-sim: deterministic synthetic nightlife simulator (ALL OUTPUT SYNTHETIC)"
requires-python = ">=3.11"
dependencies = ["pandas>=3.0", "numpy>=2.0"]

[tool.setuptools]
package-dir = {"simulator" = "."}
packages = ["simulator"]

[tool.setuptools.package-data]
simulator = ["config/*.json", "data/*.csv"]
