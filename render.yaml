# Render Blueprint (integration, v2 §C) — root copy of backend/render.yaml pointed at the
# merged branch. Not deployed (no Render account yet); steps in DEMO.md §Deploy.
services:
  - type: web
    name: nightlife-autopilot-api   # must match frontend/vercel.json /api rewrite target
    runtime: docker
    plan: free                      # ephemeral disk: demo writes reset on restart
    branch: nightlife/integration
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: DEMO_NOW
        value: "2026-11-14T23:30:00-05:00"
      - key: INCLUDE_SYNTHETIC
        value: "1"
      - key: ALLOW_FIXTURE_SIM
        value: "0"
      - key: DEMO_AUTH
        value: "1"
      - key: RECS_MODE
        value: auto
      - key: FEATURE_ROUTING
        value: "1"
      - key: FEATURE_HEATMAP
        value: "1"
      - key: CORS_ORIGINS
        value: "https://nightlife-autopilot.vercel.app,http://localhost:5173"  # replace with the real Vercel URL
      - key: ADMIN_TOKEN
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
