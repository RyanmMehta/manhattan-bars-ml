[project]
name = "nightlife-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["publicdb: uses the real data/manhattan_bars.db (skipped if missing)",
           "recs: needs the real recs package"]
